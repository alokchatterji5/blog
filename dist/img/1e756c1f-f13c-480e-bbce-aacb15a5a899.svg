<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 10; }
      .accent { fill: #1f2937; stroke: #3fb950; stroke-width: 1.5; rx: 10; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; fill: #e6edf3; font-size: 16px; font-weight: 600; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; fill: #8b949e; font-size: 12px; }
      .line { stroke: #30363d; stroke-width: 1.5; fill: none; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; fill: #e6edf3; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="900" height="560" rx="14"/>
  <text x="30" y="45" class="title">EDITH — the shape, not the services</text>

  <!-- Entry layer -->
  <rect class="accent" x="330" y="80" width="240" height="60"/>
  <text x="450" y="105" class="label" text-anchor="middle">Single Entry Point</text>
  <text x="450" y="124" class="sub" text-anchor="middle">one door, always</text>

  <!-- Identity layer -->
  <rect class="accent" x="330" y="170" width="240" height="60"/>
  <text x="450" y="195" class="label" text-anchor="middle">Shared Identity Layer</text>
  <text x="450" y="214" class="sub" text-anchor="middle">consistent everywhere or nowhere</text>

  <!-- Service categories -->
  <rect class="box" x="60" y="290" width="200" height="80"/>
  <text x="160" y="320" class="label" text-anchor="middle">Media &amp; Storage</text>
  <text x="160" y="340" class="sub" text-anchor="middle">the stuff you actually own</text>

  <rect class="box" x="350" y="290" width="200" height="80"/>
  <text x="450" y="320" class="label" text-anchor="middle">Personal Tools</text>
  <text x="450" y="340" class="sub" text-anchor="middle">notes, photos, docs</text>

  <rect class="box" x="640" y="290" width="200" height="80"/>
  <text x="740" y="320" class="label" text-anchor="middle">AI &amp; Automation</text>
  <text x="740" y="340" class="sub" text-anchor="middle">agents, pipelines</text>

  <!-- Observability wraps everything -->
  <rect class="box" x="30" y="440" width="840" height="70" stroke-dasharray="6,4"/>
  <text x="450" y="470" class="label" text-anchor="middle">Monitoring &amp; Observability</text>
  <text x="450" y="490" class="sub" text-anchor="middle">wraps around everything, sees everything, touches nothing</text>

  <!-- Connectors -->
  <path class="line" d="M450,140 L450,170"/>
  <path class="line" d="M450,230 L450,260 L160,260 L160,290"/>
  <path class="line" d="M450,230 L450,290"/>
  <path class="line" d="M450,230 L450,260 L740,260 L740,290"/>

  <path class="line" d="M160,370 L160,440"/>
  <path class="line" d="M450,370 L450,440"/>
  <path class="line" d="M740,370 L740,440"/>

</svg>
