<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<style>
.flow{stroke-dasharray:8 10;animation:dash 1.2s linear infinite}
.flow.slow{animation-duration:2.4s}
@keyframes dash{to{stroke-dashoffset:-36}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.18);opacity:0}}
.bob{animation:bob 3s ease-in-out infinite}
.bob.b2{animation-delay:.5s}.bob.b3{animation-delay:1s}.bob.b4{animation-delay:1.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.t{fill:#E6EDF3}.d{fill:#8B949E}
</style>
<rect width="1000" height="620" fill="#0D1117"/>
<text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" class="t">Meet the crew</text>
<text x="500" y="68" text-anchor="middle" font-size="13" class="d">one front door, four specialists, zero free-form shells</text>
<line x1="130" y1="310" x2="250" y2="310" stroke="#58A6FF" stroke-width="4" class="flow"/>
<circle cx="80" cy="310" r="50" fill="#0D2238" stroke="#58A6FF" stroke-width="4"/><text x="80" y="324" text-anchor="middle" font-size="40">📱</text>
<text x="80" y="388" text-anchor="middle" font-size="14" font-weight="700" class="t">Me</text>
<path d="M408 310 C530 310 500 90 648 90" fill="none" stroke="#3FB950" stroke-width="3" class="flow"/>
<path d="M408 310 C530 310 500 230 648 230" fill="none" stroke="#BC8CFF" stroke-width="3" class="flow"/>
<path d="M408 310 C530 310 500 370 648 370" fill="none" stroke="#F0883E" stroke-width="3" class="flow"/>
<path d="M408 310 C530 310 500 510 648 510" fill="none" stroke="#FF7B72" stroke-width="3" class="flow"/>
<circle cx="330" cy="310" r="78" fill="none" stroke="#F2CC60" stroke-width="3" class="pulse"/>
<circle cx="330" cy="310" r="74" fill="#2A2410" stroke="#F2CC60" stroke-width="6"/><text x="330" y="330" text-anchor="middle" font-size="58">🕶️</text>
<rect x="278" y="402" width="104" height="30" rx="15" fill="#F2CC60"/><text x="330" y="422" text-anchor="middle" font-size="15" font-weight="800" fill="#1A1400">EDITH</text>
<text x="330" y="452" text-anchor="middle" font-size="12" class="d">orchestrator · plans &amp; delegates</text>
<g class="bob b1">
<circle cx="700" cy="90" r="52" fill="none" stroke="#3FB950" stroke-width="3" class="pulse"/>
<circle cx="700" cy="90" r="48" fill="#10261A" stroke="#3FB950" stroke-width="5"/><text x="700" y="104" text-anchor="middle" font-size="40">📊</text>
</g>
<rect x="766" y="56" width="84" height="26" rx="13" fill="#3FB950"/><text x="775" y="74" font-size="14" font-weight="800" fill="#0D1117">FRIDAY</text>
<text x="766" y="98" font-size="12" fill="#C9D1D9">Health sentinel · read-only</text>
<text x="766" y="118" font-size="12" font-style="italic" fill="#3FB950">“All systems green. Disk is at 61%.”</text>
<g class="bob b2">
<circle cx="700" cy="230" r="52" fill="none" stroke="#BC8CFF" stroke-width="3" class="pulse"/>
<circle cx="700" cy="230" r="48" fill="#251838" stroke="#BC8CFF" stroke-width="5"/><text x="700" y="244" text-anchor="middle" font-size="40">🎬</text>
</g>
<rect x="766" y="196" width="106" height="26" rx="13" fill="#BC8CFF"/><text x="775" y="214" font-size="14" font-weight="800" fill="#0D1117">VERONICA</text>
<text x="766" y="238" font-size="12" fill="#C9D1D9">Media pipeline operator</text>
<text x="766" y="258" font-size="12" font-style="italic" fill="#BC8CFF">“Library is quiet. Nothing stuck.”</text>
<g class="bob b3">
<circle cx="700" cy="370" r="52" fill="none" stroke="#F0883E" stroke-width="3" class="pulse"/>
<circle cx="700" cy="370" r="48" fill="#2B1C0F" stroke="#F0883E" stroke-width="5"/><text x="700" y="384" text-anchor="middle" font-size="40">🛡️</text>
</g>
<rect x="766" y="336" width="84" height="26" rx="13" fill="#F0883E"/><text x="775" y="354" font-size="14" font-weight="800" fill="#0D1117">JARVIS</text>
<text x="766" y="378" font-size="12" fill="#C9D1D9">Identity &amp; access</text>
<text x="766" y="398" font-size="12" font-style="italic" fill="#F0883E">“Shall I create the account, sir?”</text>
<g class="bob b4">
<circle cx="700" cy="510" r="52" fill="none" stroke="#FF7B72" stroke-width="3" class="pulse"/>
<circle cx="700" cy="510" r="48" fill="#2E1616" stroke="#FF7B72" stroke-width="5"/><text x="700" y="524" text-anchor="middle" font-size="40">🦾</text>
</g>
<rect x="766" y="476" width="73" height="26" rx="13" fill="#FF7B72"/><text x="775" y="494" font-size="14" font-weight="800" fill="#0D1117">DUM-E</text>
<text x="766" y="518" font-size="12" fill="#C9D1D9">The builder · enabled &amp; working</text>
<text x="766" y="538" font-size="12" font-style="italic" fill="#FF7B72">“Build done. *happy beep*”</text>
</svg>